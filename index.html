<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Zarasų dirbtuvės</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #03101e;
      color: white;
    }
    main { max-width: 764px; padding: 32px; text-align: center; }
    h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.15; }
    p { font-size: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Svetainę kursime kartu</h1>
    <p>Spalio 14 d. Zarasų dirbtuvių metu čia atsiras mūsų kuriama pavyzdinė svetainė.</p>
    <p>Tomas Morkūnas · FAD</p>
  </main>
</body>
</html>
